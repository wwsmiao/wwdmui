<!-- ====== 抖音提取 ====== -->
<div id="page-douyin" class="page center-page">
  <div class="center-wrap">
    <h1 class="ph">&#127925; 抖音提取</h1>

    <!-- 卡片1: 提取链接 -->
    <div class="card">
      <div style="margin-bottom:10px">
        <textarea id="dyUrl" class="sinput sinput-wide gscroll" placeholder="粘贴抖音链接即可（视频/笔记），支持多链接&#10;&#10;例如：&#10;https://www.douyin.com/video/XXXX&#10;https://v.douyin.com/XXXX&#10;https://www.douyin.com/note/XXXX" style="width:100%;height:120px;resize:vertical;font-size:13px;line-height:1.6"></textarea>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap">
        <button class="btn btn1" id="dyFetchBtn" onclick="dyFetch()" style="font-size:14px"><i class="bi bi-search"></i> 提取</button>
      </div>
      <div id="dyStatus" style="color:var(--text2);font-size:12.5px;min-height:18px"></div>
    </div>

    <!-- 卡片2: 多链接标签页 + 预览 -->
    <div class="card" id="dyResultCard" style="margin-top:16px;display:none">
      <!-- 链接标签栏 -->
      <div id="dyTabBar" class="gscroll" style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--border)"></div>
      <!-- 视频预览 -->
      <div id="dyVideoSection" style="display:none;margin-bottom:12px">
        <video id="dyCoverVideo" controls style="max-width:100%;max-height:400px;border-radius:8px;margin-bottom:8px" poster="" crossorigin="anonymous"></video>
        <div id="dyCoverOnly" style="display:none;margin-bottom:8px;border-radius:8px;overflow:hidden;max-height:300px">
          <img id="dyCoverImg" src="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'" crossorigin="anonymous">
        </div>
      </div>
      <!-- 图片网格 -->
      <div id="dyGridWrap" style="display:none">
        <div style="margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button class="btn btn6 btn-xs" onclick="dySelectAll()"><i class="bi bi-check2-square"></i> 全选</button>
          <button class="btn btn6 btn-xs" onclick="dyDeselectAll()"><i class="bi bi-square"></i> 取消全选</button>
          <span id="dySelCount" style="font-size:12px;color:var(--text2)">已选 0 / 0</span>
        </div>
        <div id="dyGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
      </div>
      <!-- 描述信息 -->
      <div id="dyResultDesc" style="font-size:13px;color:var(--text1);line-height:1.6;margin-top:4px"></div>
    </div>

    <!-- 卡片3: 下载控制 -->
    <div class="card" id="dyDlCard" style="margin-top:16px;display:none">
      <h3 style="margin:0 0 12px 0;font-size:15px">&#128228; 下载</h3>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div class="slabel-block"><div class="slabel">保存目录</div></div>
        <input type="text" id="dySaveDir" class="sinput sinput-wide" placeholder="C:\tmp\douyin-tiqu\images" style="flex:1;min-width:220px">
        <button class="btn btn6" onclick="dyOpenSaveDir()" title="打开文件夹" style="font-size:18px;padding:4px 8px"><i class="bi bi-folder2-open"></i></button>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px" id="dyTmplRow">
        <div class="slabel-block" style="flex-shrink:0;margin-top:4px"><div class="slabel">命名模板</div><div class="shint">{index} {uri} {ext} {datetime}</div></div>
        <input type="text" id="dyNameTmpl" class="sinput sinput-wide" placeholder="{index:02d}.{ext}" style="flex:1;min-width:200px">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn2" id="dyDlBtn" onclick="dyDownload()" disabled><i class="bi bi-download"></i> 开始下载</button>
        <button class="btn btn6" id="dyDlDeselectBtn" onclick="dyDeselectAll();dyUpdateDlBtn()" style="display:none"><i class="bi bi-x-circle"></i> 取消选择</button>
      </div>
      <div id="dyDlStatus" style="color:var(--text2);font-size:12px;margin-top:10px;min-height:18px"></div>
      <div id="dyDlProgress" style="display:none;margin-top:8px">
        <div class="pbar-bg"><div class="pbar-fill" id="dyDlBar" style="width:0%;min-width:0">0%</div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px">
          <span id="dyDlSize">0 / 0 MB</span><span id="dyDlSpeed">0 MB/s</span>
        </div>
      </div>
    </div>

    <!-- 卡片4: Cookie 设置 -->
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 12px 0;font-size:15px">&#128273; Cookie 配置</h3>
      <div style="color:var(--text2);font-size:12px;margin-bottom:12px;line-height:1.6">
        抖音提取需要有效的 Cookie。请在"全局设置"中配置 <code>dy_cookie.json</code> 文件路径。
        <br><span style="color:var(--text3)">该文件内容为原始 Cookie 字符串（key1=val1; key2=val2）或 JSON 格式</span>
      </div>
      <a href="javascript:switchPage(event,'settings')" style="display:inline-block;font-size:12px;color:var(--blue);text-decoration:underline">&#8594; 前往全局设置配置 Cookie 路径</a>
    </div>
  </div>
</div>
