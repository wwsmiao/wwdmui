<!-- ====== 笔记本（v5.1：侧边栏页面 → FAB 唤出大弹窗）======
     布局沿用 .lgmodal 大弹窗体系（同运行日志 / 插件克隆日志弹窗）：
     外层 .lgmodal-mask 管遮罩与「点空白处关闭」，.lgmodal 内部分
     hd（标题 / 新建 / 关闭）+ body（原来的两栏 notes-app，一字未动）。
     入口变化：侧边栏「笔记本」项已删除，改由右下角 FAB 的 journal-text
     按钮唤出；notesInit() 不再由 switchPage 触发，改由 notesOpen() 调。
     Esc 可关闭（确认弹窗开着时 Esc 归它，见 notes.js）。 -->
<div class="lgmodal-mask" id="notesModal" style="display:none" onclick="if(event.target===this)notesClose()">
  <div class="lgmodal notes-modal">
    <div class="lgmodal-hd">
      <span class="lgmodal-ico"><i class="bi bi-journal-text"></i></span>
      <h3>笔记本</h3>
      <span style="flex:1"></span>
      <button class="btn btn1" onclick="noteNew()" title="新建笔记"><i class="bi bi-plus-lg"></i> 新建</button>
      <button class="btn btn2" onclick="notesClose()" title="关闭（Esc）"><i class="bi bi-x-lg"></i> 关闭</button>
    </div>
    <div class="lgmodal-body">
      <div id="notes-app" class="notes-app">
        <!-- 左栏: 笔记列表（v5.1 去掉了窗内标题头——标题已上移到弹窗 hd，新建按钮也在那里） -->
        <div id="notes-list-pane" class="notes-pane notes-list-pane">
          <div class="notes-search-row">
            <input type="text" id="noteSearch" class="sinput" placeholder="搜索笔记..." oninput="noteDebounceSearch()" style="flex:1">
            <button class="btn btn6" onclick="noteSearch()" title="搜索" style="padding:6px 10px"><i class="bi bi-search"></i></button>
          </div>
          <div id="noteTagBar" class="notes-tagbar"></div>
          <div id="noteList" class="notes-list gscroll"></div>
          <div id="noteListEmpty" class="notes-empty" style="display:none">
            <div style="font-size:40px;opacity:0.3">&#128221;</div>
            <div>暂无笔记，点击「新建」开始记录</div>
          </div>
        </div>

        <!-- 右栏: 编辑器 -->
        <div id="notes-editor-pane" class="notes-pane notes-editor-pane">
          <!-- 空状态 -->
          <div id="noteEditorEmpty" class="notes-empty" style="height:100%;justify-content:center;align-items:center">
            <div style="font-size:56px;opacity:0.25">&#128221;</div>
            <div style="font-size:15px;color:var(--text2);margin-top:12px">选择左侧笔记，或点击「新建」开始</div>
          </div>

          <!-- 编辑器主体 -->
          <div id="noteEditor" style="display:none;height:100%;flex-direction:column">
            <div class="notes-editor-hd">
              <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
                <input type="text" id="noteTitle" class="sinput" placeholder="笔记标题" style="flex:1;font-size:16px;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:8px 4px">
              </div>
              <div class="notes-color-row" id="noteColorRow">
                <span class="notes-color" style="background:#4a6fa5" data-c="#4a6fa5" title="蓝灰"></span>
                <span class="notes-color" style="background:#c38d94" data-c="#c38d94" title="玫瑰"></span>
                <span class="notes-color" style="background:#10b981" data-c="#10b981" title="绿色"></span>
                <span class="notes-color" style="background:#f59e0b" data-c="#f59e0b" title="橙色"></span>
                <span class="notes-color" style="background:#ef4444" data-c="#ef4444" title="红色"></span>
                <span class="notes-color" style="background:#3b82f6" data-c="#3b82f6" title="蓝色"></span>
                <span class="notes-color" style="background:#14b8a6" data-c="#14b8a6" title="青色绿"></span>
                <span class="notes-color" style="background:#f472b6" data-c="#f472b6" title="粉色"></span>
              </div>
              <input type="text" id="noteTag" class="sinput" placeholder="标签" style="width:110px" title="标签，用于分类筛选">
              <button class="btn btn6" id="notePinBtn" onclick="noteTogglePin()" title="置顶"><i class="bi bi-pin-angle"></i></button>
              <button class="btn btn6" onclick="notePreviewToggle()" id="notePreviewBtn" title="预览"><i class="bi bi-eye"></i></button>
              <button class="btn btn7" onclick="noteDelete()" title="删除笔记"><i class="bi bi-trash"></i></button>
              <button class="btn btn1" onclick="noteSave()"><i class="bi bi-save"></i> 保存</button>
            </div>

            <!-- 工具栏 -->
            <div class="notes-toolbar" id="noteToolbar">
              <button class="ntb" onclick="noteInsert('**','**')" title="粗体"><i class="bi bi-type-bold"></i></button>
              <button class="ntb" onclick="noteInsert('*','*')" title="斜体"><i class="bi bi-type-italic"></i></button>
              <button class="ntb" onclick="noteInsert('~~','~~')" title="删除线"><i class="bi bi-type-strikethrough"></i></button>
              <span class="ntb-sep"></span>
              <button class="ntb" onclick="noteInsert('# ','',true)" title="标题1"><i class="bi bi-type-h1"></i></button>
              <button class="ntb" onclick="noteInsert('## ','',true)" title="标题2"><i class="bi bi-type-h2"></i></button>
              <button class="ntb" onclick="noteInsert('### ','',true)" title="标题3"><i class="bi bi-type-h3"></i></button>
              <span class="ntb-sep"></span>
              <button class="ntb" onclick="noteInsert('- ','',true)" title="无序列表"><i class="bi bi-list-ul"></i> 列表</button>
              <button class="ntb" onclick="noteInsert('1. ','',true)" title="有序列表"><i class="bi bi-list-ol"></i> 列表</button>
              <button class="ntb" onclick="noteInsert('> ','',true)" title="引用"><i class="bi bi-quote"></i> 引用</button>
              <button class="ntb" onclick="noteInsert('\x60\x60\x60\n','\n\x60\x60\x60')" title="代码块"><i class="bi bi-code-slash"></i> 代码</button>
              <button class="ntb" onclick="noteInsert('[','](https://)')" title="链接"><i class="bi bi-link-45deg"></i> 链接</button>
              <span class="ntb-sep"></span>
              <button class="ntb" onclick="noteInsert('![','](图片URL)')" title="图片"><i class="bi bi-image"></i> 图片</button>
              <button class="ntb" onclick="noteInsert('---\n','')" title="分隔线"><i class="bi bi-dash-lg"></i> 分隔线</button>
            </div>

            <div id="noteEditorBody" style="flex:1;min-height:0;position:relative">
              <textarea id="noteContent" class="sinput gscroll" placeholder="开始写点什么..."
                style="width:100%;height:100%;resize:none;background:transparent;border:none;outline:none;padding:16px;font-size:14px;line-height:1.8;color:var(--text)"></textarea>
              <div id="notePreview" class="notes-preview gscroll" style="display:none;height:100%;overflow-y:auto;padding:16px;font-size:14px;line-height:1.8"></div>
            </div>

            <div class="notes-editor-ft">
              <span id="noteStatus" style="color:var(--text3);font-size:11.5px">就绪</span>
              <span style="flex:1"></span>
              <span id="noteCharCount" style="color:var(--text3);font-size:11.5px"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
