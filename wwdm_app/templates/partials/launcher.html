<!-- ====== wwdmc启动器 ====== -->
<div id="page-launcher" class="page active">
  <h1 class="ptitle"><span class="mi-icon"><i class="bi bi-rocket-takeoff"></i></span>wwdmc 启动器</h1>
  <div class="card">
    <div class="dlbar" style="margin-bottom:12px">
      <button class="btn btn1" id="cuiStartBtn" onclick="cuiStart()"><i class="bi bi-play-fill"></i> 启动 ComfyUI</button>
      <button class="btn btn3" id="cuiStopBtn" onclick="cuiStop()" disabled><i class="bi bi-stop-fill"></i> 停止 ComfyUI</button> <button class="btn btn3" onclick="repairKillComfyUI()" title="强制结束所有 ComfyUI Python 进程"><i class="bi bi-lightning-charge-fill"></i> 强制结束</button>
      <button class="btn btn6 btn-sm" id="cuiAutoBtn" onclick="cuiToggleAuto()" title="自动滚动到最新日志"><i class="bi bi-arrow-down-circle"></i> 自动</button>
      <span style="flex:1"></span>
      <span id="cuiStatus" style="color:var(--text2);font-size:12.5px">准备就绪</span>
    </div>
    <div style="margin-bottom:10px;font-size:10px;color:var(--cyan);word-break:break-all;line-height:1.5" id="cuiCmdPreview2"></div>
    <!-- <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;max-height:520px;overflow-y:auto;font-family:var(--font);font-size:11.5px;line-height:1.65;color:var(--text2);white-space:pre-wrap;word-break:break-all" id="cuiLog">等待启动 ComfyUI ...</div> -->
    <div style="padding:16px;max-height:520px;overflow-y:auto;font-family:var(--font);font-size:11.5px;line-height:1.65;color:var(--text2);white-space:pre-wrap;word-break:break-all" id="cuiLog" class="gscroll">等待启动 ComfyUI ...</div>

    <div style="margin-top:10px;display:flex;justify-content:flex-end">
      <button class="btn btn6 btn-sm" onclick="cuiCopyLog()" title="复制当前全部日志"><i class="bi bi-clipboard"></i> 复制日志</button>
    </div>
  </div>
</div>
